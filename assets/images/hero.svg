<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.12" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Decorative Shapes -->
  <circle cx="400" cy="300" r="260" fill="url(#bgGrad)" opacity="0.7" />
  <circle cx="650" cy="120" r="90" fill="#E0F2FE" opacity="0.6" />
  <circle cx="150" cy="480" r="110" fill="#E0F2FE" opacity="0.6" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#CBD5E1" stroke-width="1" opacity="0.25">
    <line x1="100" y1="100" x2="700" y2="100" />
    <line x1="100" y1="200" x2="700" y2="200" />
    <line x1="100" y1="300" x2="700" y2="300" />
    <line x1="100" y1="400" x2="700" y2="400" />
    <line x1="100" y1="500" x2="700" y2="500" />
    <line x1="200" y1="50" x2="200" y2="550" />
    <line x1="400" y1="50" x2="400" y2="550" />
    <line x1="600" y1="50" x2="600" y2="550" />
  </g>

  <!-- Central Dashboard Frame -->
  <rect x="180" y="110" width="440" height="340" rx="20" fill="url(#cardGrad)" filter="url(#dropShadow)" stroke="#E2E8F0" stroke-width="2" />
  
  <!-- Dashboard Header Bar -->
  <path d="M 180 130 A 20 20 0 0 1 200 110 L 600 110 A 20 20 0 0 1 620 130 L 620 155 L 180 155 Z" fill="#F1F5F9" />
  <circle cx="210" cy="132.5" r="5" fill="#EF4444" />
  <circle cx="226" cy="132.5" r="5" fill="#F59E0B" />
  <circle cx="242" cy="132.5" r="5" fill="#10B981" />

  <!-- URL Bar inside illustration -->
  <rect x="270" y="122" width="330" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
  <text x="290" y="137" font-family="sans-serif" font-size="11" fill="#10B981" font-weight="600">🔒 https://secure-website.com</text>

  <!-- Central Security Shield -->
  <g filter="url(#dropShadow)">
    <path d="M 400 190 C 470 190 500 210 500 270 C 500 350 430 400 400 420 C 370 400 300 350 300 270 C 300 210 330 190 400 190 Z" fill="url(#primaryGrad)" />
    <!-- Inner Shield Contour -->
    <path d="M 400 205 C 455 205 480 222 480 270 C 480 338 424 382 400 400 C 376 382 320 338 320 270 C 320 222 345 205 400 205 Z" fill="none" stroke="#60A5FA" stroke-width="3" stroke-dasharray="6,4" />
    <!-- White Checkmark -->
    <path d="M 370 295 L 392 317 L 438 271" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Floating Floating Analytics Card Left -->
  <g filter="url(#dropShadow)">
    <rect x="120" y="240" width="160" height="90" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="150" cy="275" r="16" fill="#D1FAE5" />
    <path d="M 144 275 L 148 279 L 156 271" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <text x="175" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A">Risk Score</text>
    <text x="175" y="288" font-family="sans-serif" font-size="16" font-weight="extrabold" fill="#10B981">98 / 100</text>
    <text x="135" y="316" font-family="sans-serif" font-size="10" fill="#64748B">🟢 Safe Domain</text>
  </g>

  <!-- Floating Floating Analytics Card Right -->
  <g filter="url(#dropShadow)">
    <rect x="520" y="320" width="170" height="95" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="535" y="335" width="30" height="30" rx="8" fill="#DBEAFE" />
    <path d="M 545 350 L 555 350 M 550 345 L 550 355" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
    <text x="575" y="348" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F172A">AI Scan</text>
    <text x="575" y="362" font-family="sans-serif" font-size="10" fill="#64748B">Threat Database</text>
    <rect x="535" y="380" width="135" height="8" rx="4" fill="#E2E8F0" />
    <rect x="535" y="380" width="115" height="8" rx="4" fill="url(#cyanGrad)" />
  </g>

  <!-- Decorative Orbit Dots -->
  <circle cx="280" cy="180" r="7" fill="#3B82F6" />
  <circle cx="530" cy="200" r="5" fill="#10B981" />
  <circle cx="260" cy="420" r="6" fill="#F59E0B" />
  <circle cx="500" cy="460" r="8" fill="#6366F1" />
  
  <!-- Pulse Wave Lines -->
  <path d="M 280 470 C 350 490 450 490 520 470" fill="none" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4,4" />
</svg>
